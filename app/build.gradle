plugins { id 'com.android.application' }
android {
    namespace 'com.ff.panel'
    compileSdk 34
    defaultConfig {
        applicationId "com.ff.panel"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt" } }
}
